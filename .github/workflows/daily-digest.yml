name: Daily Intelligence Synthesis

on:
  schedule:
    # 06:00, 14:00, and 22:00 UTC every day (3x daily)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Synthesis Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/pipeline.mjs

      - name: Commit and Push Updated Dispatches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(data): automated daily news synthesis [skip ci]"
            git push
          else
            echo "No data changes detected."
          fi
